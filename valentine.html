<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💜</title>
<link rel="stylesheet" href="./css/style.css">
</head>

<body class="centered-page">

<div class="valentine-container" id="valentineContent">
    <h1>Please give me the chance to be lucky enough to be your Valentine 💜</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 💜</button>
        <button id="noBtn">No </button>
    </div>

    <div id="errorBox" class="error-box">
        ERROR 404: "No" Option Not Found 💜
    </div>
</div>

<div id="overlay" class="overlay hidden">
    <div class="overlay-content">
        <h2>Click Next and turn your volume up 💜</h2>
        <button id="nextBtn">Next 💜</button>
    </div>
</div>

<div class="falling-container"></div>

<script src="./script.js"></script>
</body>
</html>
